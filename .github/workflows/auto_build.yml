name: 自动构建并上传

on:
  push:
    branches: [ "backup-0.2.4" ]
    
jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install and Build
        run: |
          yarn
          yarn run build
  
      - name: Commit dist
        run: |
          git checkout --orphan dist
          mv dist ../
          rm -rf ./.github ./.gitignore ./*
          mv ../dist ./dist
          git config --local user.email 'wr15624916906@gmail.com'
          git config --local user.name 'padoru233'
          git add .
          git commit -m "chore(dist): upload dist"

      - name: Upload dist files
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: dist
          repository: padoru233/zhenxun_bot_webui
          force: true
